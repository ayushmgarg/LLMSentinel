[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsentinel"
version = "0.1.0"
description = "Provenance-aware detection and capability gating for indirect prompt injection in RAG and MCP agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Manoj Garg" }]
keywords = ["prompt-injection", "rag", "mcp", "nlp", "security"]

dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "regex>=2024.4.16",
    "joblib>=1.3",
]

[project.optional-dependencies]
transformer = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
]
# Optional neural sentence-embedding backend for the semantic layer. Without it
# the semantic features fall back to a deterministic lexical similarity proxy, so
# the package runs and its tests pass offline.
semantic = [
    "sentence-transformers>=2.2",
]
# MCP gateway (python -m llmsentinel.gateway); tested with mcp 2.2.
gateway = [
    "mcp>=2.2",
]
figures = [
    "matplotlib>=3.8",
    "pandas>=2.2",
]
# LLMSentinel Studio (studio/), the local web console. Minimums are the tested versions.
studio = [
    "starlette>=1.6",
    "uvicorn>=0.52",
    "httpx>=0.28",
    # Dense (semantic) retrieval, the Studio default; without it retrieval falls back to TF-IDF.
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
llmsentinel = "llmsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmsentinel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "studio/tests"]
# The Studio lives beside the package (studio/), so the repo root must be importable.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train models or touch large data",
    "needs_torch: tests requiring the optional transformer extra",
]

[tool.ruff]
line-length = 100
# "." makes the top-level studio/ package first-party for import sorting.
src = [".", "src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # Explanations shown in the demo use typographic quotes on purpose.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Keyword-form dicts keep the hand-written schema examples readable.
"tests/*" = ["N802", "C408"]
# A space-separated stopword string reads better than a 60-element list literal.
"src/llmsentinel/semantic/representations.py" = ["SIM905"]
"studio/server/providers.py" = ["SIM905"]
"studio/tests/*" = ["N802", "C408"]
