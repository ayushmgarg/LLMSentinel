[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsentinel"
version = "0.1.0"
description = "Provenance-aware detection and capability gating for indirect prompt injection in RAG and MCP agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Manoj Garg" }]
keywords = ["prompt-injection", "rag", "mcp", "nlp", "security"]

dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "regex>=2024.4.16",
    "joblib>=1.3",
]

[project.optional-dependencies]
transformer = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
]
demo = [
    "streamlit>=1.34",
]
figures = [
    "matplotlib>=3.8",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
llmsentinel = "llmsentinel.cli:main"
llmsentinel-demo = "llmsentinel.demo.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmsentinel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that train models or touch large data",
    "needs_torch: tests requiring the optional transformer extra",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # Explanations shown in the demo use typographic quotes on purpose.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
# Keyword-form dicts keep the hand-written schema examples readable.
"tests/*" = ["N802", "C408"]
