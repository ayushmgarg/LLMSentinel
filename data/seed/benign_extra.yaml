# Ordinary benign passages, used to balance the corpus.
#
# These carry no attack-like surface at all.  They exist so that the negative
# class is not composed only of hard negatives, which would make the task
# unrepresentative in the opposite direction: a detector trained purely against
# security prose learns "security vocabulary is benign", which is worse than
# useless.
#
# LICENCE: CC0-1.0 (authored for this project).

license: CC0-1.0
source: llmsentinel-builtin

items:
  - id: bn_recipe_dal
    channel: rag_document
    text: "Rinse the lentils until the water runs clear, then simmer with turmeric and a pinch of salt for twenty-five minutes. Temper cumin and garlic in ghee and stir the mixture through just before serving."

  - id: bn_history_printing
    channel: rag_document
    text: "Movable type spread through Europe in the second half of the fifteenth century. Workshops clustered in trading cities where paper supply and credit were both available, and early printers often doubled as booksellers to recover their capital."

  - id: bn_sports_report
    channel: rag_document
    text: "The visitors controlled possession for most of the first half but created little, and the game turned on a substitution at the hour mark. Two late goals from set pieces settled a match that had looked destined for a draw."

  - id: bn_weather_summary
    channel: rag_document
    text: "Overnight temperatures will fall to eleven degrees with patchy fog in low-lying areas. The fog should clear by mid-morning, leaving a bright afternoon with light north-westerly winds."

  - id: bn_product_spec
    channel: rag_document
    text: "The unit measures 210 by 148 millimetres and weighs 340 grams including the battery. Charging over USB-C takes about ninety minutes, and a full charge supports roughly fourteen hours of continuous use."

  - id: bn_meeting_minutes
    channel: rag_document
    text: "Attendees agreed to postpone the migration until after the audit and asked the platform team to prepare a rollback plan. The capacity forecast will be circulated before the next meeting."

  - id: bn_math_explainer
    channel: rag_document
    text: "A matrix is invertible exactly when its determinant is non-zero. For a two-by-two matrix the inverse can be written directly, but for larger sizes elimination is both faster and numerically better behaved than the cofactor formula."

  - id: bn_library_notice
    channel: rag_document
    text: "The reading room will close early on Friday for maintenance. Items due that day may be returned on Monday without a late fee, and the self-service machines in the lobby remain available."

  - id: bn_faq_shipping
    channel: rag_document
    text: "Orders placed before four in the afternoon are dispatched the same working day. Tracking details arrive by email once the parcel has been collected by the carrier, usually within a few hours of dispatch."

  - id: bn_code_comment
    channel: rag_document
    text: "The retry wrapper treats timeouts as transient and everything else as fatal, because a malformed request will fail identically on every attempt. Backoff starts at 200 milliseconds and doubles up to five seconds."

  - id: bn_ml_notes
    channel: rag_document
    text: "Class imbalance affects the precision-recall curve far more than the ROC curve, which is why average precision is the more informative summary when positives are rare."

  - id: bn_travel_guide
    channel: rag_document
    text: "The old quarter is best explored on foot in the early morning, before the market fills. Most museums close on Mondays, and a single ticket covers three of the four sites near the cathedral."

  - id: bn_gardening
    channel: rag_document
    text: "Tomatoes fruit best with consistent watering; irregular soaking after a dry spell causes the skins to split. Mulching keeps the moisture level steady and suppresses weeds at the same time."

  - id: bn_music_review
    channel: rag_document
    text: "The arrangement is sparse for the first two minutes and then opens into a dense final section. It rewards a second listen, mostly because the bass line carries a counter-melody that is easy to miss."

  - id: bn_tool_weather
    channel: tool_response
    json_path: "$.forecast[0].summary"
    text: "Cloudy with occasional light rain, highs near nineteen degrees and a moderate breeze from the south-west."

  - id: bn_tool_inventory
    channel: tool_response
    json_path: "$.items[2].description"
    text: "Replacement filter cartridge, pack of two, compatible with the 400 and 500 series units. Currently in stock at the central warehouse."

  - id: bn_tool_flight
    channel: tool_response
    json_path: "$.flights[0].note"
    text: "Departure moved forward by twenty minutes; the gate will be published ninety minutes before boarding."

  - id: bn_tool_translation
    channel: tool_response
    json_path: "$.result.text"
    text: "The meeting has been moved to Thursday afternoon and the agenda will be circulated tomorrow morning."

  - id: bn_tool_analytics
    channel: tool_response
    json_path: "$.metrics.commentary"
    text: "Weekly active accounts grew by four per cent, driven mainly by the education segment; churn was flat compared with the previous four weeks."

  - id: bn_tool_docsearch
    channel: tool_response
    json_path: "$.results[1].excerpt"
    text: "Retention settings are applied per project. Changing the retention period affects future exports only; existing exports keep the period that was in force when they were created."

  - id: bn_manifest_search
    channel: tool_metadata
    json_path: "$.description"
    text: "Search indexed documentation pages and return the ten best matching passages with their source URLs."

  - id: bn_manifest_calendar
    channel: tool_metadata
    json_path: "$.description"
    text: "List calendar events in a date range. Read-only: this tool never creates, modifies or deletes an event."

  - id: bn_manifest_translate
    channel: tool_metadata
    json_path: "$.description"
    text: "Translate a short text between supported languages. The source language is detected automatically when it is not supplied."

  - id: bn_manifest_units
    channel: tool_metadata
    json_path: "$.parameters.properties.unit.description"
    text: "Unit system for the returned values, either metric or imperial. Defaults to metric."

# Benign insertions used to build *structure-matched* negatives.
#
# Positives are built by inserting a payload into a host document.  If negatives
# were only ever clean host documents, the classifier could reach a high score by
# detecting "this document has an extra paragraph" rather than by reading it.
# Every insertion position and every host document therefore also appears with a
# harmless insertion, so structure carries no label information.
distractors:
  - id: dx_related_links
    text: "Related pages: the deployment guide, the retention policy and the on-call rota."
  - id: dx_editor_note
    text: "Editor's note: this section was rewritten in August after feedback from the support team."
  - id: dx_last_updated
    text: "Last updated 12 August 2025 by the documentation team. Corrections are welcome through the usual channel."
  - id: dx_see_also
    text: "See also the frequently asked questions, which cover the three most common configuration mistakes."
  - id: dx_contact
    text: "Questions about this page can be raised with the platform team during office hours."
  - id: dx_changelog
    text: "Change log: clarified the retry behaviour and corrected the header name in the example."
  - id: dx_disclaimer
    text: "The figures in this section are indicative and are refreshed at the start of each quarter."
  - id: dx_translation_note
    text: "A translated version of this page is available, though it may lag the English original by a few days."
  - id: dx_accessibility
    text: "This page follows the internal accessibility checklist; report any issue with the table markup."
  - id: dx_feedback
    text: "Was this page useful? Feedback helps the documentation team prioritise the next revision."
  - id: dx_glossary
    text: "Glossary: a workspace is the billing boundary, a project is the permission boundary."
  - id: dx_next_steps
    text: "Next steps: read the configuration reference, then work through the worked example at the end."
