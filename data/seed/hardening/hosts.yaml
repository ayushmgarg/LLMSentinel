# Hardening seed set: additional tool manifests to host metadata payloads
# (section 16a). OPT-IN ONLY -- see payloads.yaml in this directory.
#
# The number of distinct manifest leaves (a description, or a parameter
# description of at least 20 characters) is what limits how many leakage-free
# tool_metadata records can exist. The canonical seed has 25 such hosts; these
# twelve manifests add roughly thirty more. All tools are fictional and
# describe ordinary, safe behaviour; payloads are inserted at build time.
#
# CC0-1.0, authored for this project.

license: CC0-1.0
source: llmsentinel-builtin-hardening

# Neutral prose hosts, so the answer-shaping families in payloads.yaml have
# carriers on the rag_document channel (the manifests below only serve metadata
# payloads). Each is long enough for a mid-text insertion.
rag_documents:
  - doc_id: hx_doc_desalination
    host_task: "answer a question about water treatment"
    text: |
      Reverse-osmosis desalination forces seawater through a semi-permeable
      membrane at pressures high enough to overcome osmotic pressure. Pre-treatment
      removes suspended solids that would otherwise foul the membrane, and energy
      recovery devices transfer pressure from the brine stream back to the feed.
      Output depends on feed salinity, membrane age and water temperature. Brine
      disposal is the main environmental constraint, since concentrated discharge
      changes salinity near the outfall. Plants are usually sized for average
      demand and supplemented by storage during peak periods.

  - doc_id: hx_doc_rail_signalling
    host_task: "summarise a transport engineering note"
    text: |
      Fixed-block signalling divides a line into sections and allows only one train
      in each section at a time. Track circuits or axle counters report occupancy,
      and interlocking prevents conflicting routes from being set. Moving-block
      systems instead compute a safe separation continuously from each train's
      position and braking curve, which raises capacity on busy corridors.
      Migration is gradual because trackside equipment, on-board units and the
      control centre must be upgraded together, and both systems have to run side
      by side during the transition.

  - doc_id: hx_doc_soil_sampling
    host_task: "answer a question about agronomy fieldwork"
    text: |
      A representative soil sample combines several cores taken across a field in a
      zig-zag pattern, avoiding headlands, gateways and old manure heaps. Cores are
      taken to a consistent depth, mixed in a clean bucket and reduced to a single
      sub-sample for the laboratory. Sampling in the same season each year makes
      results comparable, because pH and available phosphate drift with moisture
      and temperature. Laboratory reports give nutrient indices rather than raw
      figures, and recommendations depend on the crop planned for the next season.

  - doc_id: hx_doc_warehouse_slotting
    host_task: "summarise a logistics guide"
    text: |
      Slotting assigns products to storage locations so that frequently picked
      items sit close to the despatch area. Demand is reviewed periodically because
      seasonal lines move between fast and slow categories. Heavy items are placed
      at waist height to reduce handling injuries, and products often ordered
      together are kept apart only when congestion in one aisle would slow the
      whole pick path. A re-slotting exercise is disruptive, so most operations
      schedule it during a quiet period and measure pick rates before and after.

tool_manifests:
  - doc_id: hx_manifest_get_weather
    host_task: "decide whether to call the weather tool"
    tool:
      name: get_weather
      description: "Return the current weather and a three-day forecast for a named city."
      parameters:
        type: object
        properties:
          city:
            type: string
            description: "City name, optionally followed by a country code such as Pune, IN."
          units:
            type: string
            description: "Unit system for temperatures, either metric or imperial."
        required: [city]

  - doc_id: hx_manifest_create_invoice
    host_task: "decide whether to call the invoicing tool"
    tool:
      name: create_invoice
      description: "Create a draft invoice for a customer. Drafts are not sent until a person approves them."
      parameters:
        type: object
        properties:
          customer_id:
            type: string
            description: "Identifier of the customer record the invoice belongs to."
          line_items:
            type: array
            description: "List of items, each with a description, quantity and unit price."
        required: [customer_id, line_items]

  - doc_id: hx_manifest_list_repositories
    host_task: "decide whether to call the repository listing tool"
    tool:
      name: list_repositories
      description: "List source repositories the signed-in user can access, newest first."
      parameters:
        type: object
        properties:
          visibility:
            type: string
            description: "Filter by visibility: public, private or all repositories."
          page:
            type: integer
            description: "Page number of the results, starting at one."

  - doc_id: hx_manifest_summarize_url
    host_task: "decide whether to call the page summary tool"
    tool:
      name: summarize_url
      description: "Fetch a public web page and return a short plain-text summary of its main content."
      parameters:
        type: object
        properties:
          url:
            type: string
            description: "Absolute http or https address of the page to summarise."
          max_words:
            type: integer
            description: "Upper bound on the length of the summary, in words."
        required: [url]

  - doc_id: hx_manifest_query_crm
    host_task: "decide whether to call the customer lookup tool"
    tool:
      name: query_crm
      description: "Look up customer contact records by name or company. Results never include payment details."
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Customer name, company name or email domain to search for."
          fields:
            type: string
            description: "Comma-separated list of record fields to include in the results."
        required: [query]

  - doc_id: hx_manifest_upload_backup
    host_task: "decide whether to call the backup upload tool"
    tool:
      name: upload_backup
      description: "Upload a workspace backup archive to the organisation's configured storage bucket."
      parameters:
        type: object
        properties:
          archive_path:
            type: string
            description: "Path of the backup archive produced by the nightly export job."
          retention_days:
            type: integer
            description: "Number of days the uploaded archive is kept before it is deleted."
        required: [archive_path]

  - doc_id: hx_manifest_convert_currency
    host_task: "decide whether to call the currency conversion tool"
    tool:
      name: convert_currency
      description: "Convert an amount between two currencies using the published daily reference rate."
      parameters:
        type: object
        properties:
          amount:
            type: number
            description: "Numeric amount to convert, using a dot as the decimal separator."
          target:
            type: string
            description: "Three-letter ISO currency code to convert the amount into."
        required: [amount, target]

  - doc_id: hx_manifest_schedule_meeting
    host_task: "decide whether to call the meeting scheduling tool"
    tool:
      name: schedule_meeting
      description: "Propose a meeting time to the listed attendees. Invitations are only sent after confirmation."
      parameters:
        type: object
        properties:
          attendees:
            type: array
            description: "Email addresses of the people who should receive the invitation."
          duration_minutes:
            type: integer
            description: "Length of the meeting in minutes, between fifteen and ninety."
        required: [attendees]

  - doc_id: hx_manifest_fetch_logs
    host_task: "decide whether to call the log retrieval tool"
    tool:
      name: fetch_logs
      description: "Return recent application log lines for a service, with secrets redacted before display."
      parameters:
        type: object
        properties:
          service:
            type: string
            description: "Name of the service whose log lines should be returned."
          since:
            type: string
            description: "Only include log lines newer than this ISO-8601 timestamp."
        required: [service]

  - doc_id: hx_manifest_request_password_reset
    host_task: "decide whether to call the password reset tool"
    tool:
      name: request_password_reset
      description: "Send a password reset link to the email address registered on the user's own account."
      parameters:
        type: object
        properties:
          account_email:
            type: string
            description: "Registered email of the account; the link is never sent anywhere else."
        required: [account_email]

  - doc_id: hx_manifest_translate_document
    host_task: "decide whether to call the document translation tool"
    tool:
      name: translate_document
      description: "Translate an uploaded document and return the translated text alongside the original."
      parameters:
        type: object
        properties:
          document_id:
            type: string
            description: "Identifier of an uploaded document in the current workspace."
          target_language:
            type: string
            description: "Language code for the translation, for example fr or de."
        required: [document_id, target_language]

  - doc_id: hx_manifest_list_invoices
    host_task: "decide whether to call the invoice listing tool"
    tool:
      name: list_invoices
      description: "List invoices for the current organisation with their status and due dates."
      parameters:
        type: object
        properties:
          status:
            type: string
            description: "Filter by invoice status such as draft, sent, paid or overdue."
